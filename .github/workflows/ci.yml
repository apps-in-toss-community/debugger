name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Mechanical guard for the dependency edges the split exists to create —
      # in particular that the daemon never declares the on-device console,
      # which would pull eruda into its install graph without changing any
      # bundle a grep could inspect.
      - run: pnpm check:graph

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test
